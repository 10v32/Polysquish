name: desktop

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-linux
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build
        run: cargo build --release -p polysquish-desktop
      - name: Package AppImage
        run: |
          set -euo pipefail
          APPDIR=dist/Polysquish.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/512x512/apps"
          cp target/release/Polysquish "$APPDIR/usr/bin/Polysquish"
          cp desktop/packaging/polysquish.desktop "$APPDIR/polysquish.desktop"
          cp desktop/packaging/polysquish.desktop "$APPDIR/usr/share/applications/polysquish.desktop"
          cp desktop/icons/icon.png "$APPDIR/polysquish.png"
          cp desktop/icons/icon.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/polysquish.png"
          ln -s usr/bin/Polysquish "$APPDIR/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # --appimage-extract-and-run: GitHub runners have no FUSE.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" dist/Polysquish-x86_64.AppImage
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Polysquish-linux-x86_64
          path: dist/Polysquish-x86_64.AppImage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/Polysquish-x86_64.AppImage

  macos:
    name: macOS ${{ matrix.arch }} (.app + .dmg)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Build
        run: cargo build --release -p polysquish-desktop --target ${{ matrix.target }}
      - name: Assemble Polysquish.app
        run: |
          set -euo pipefail
          APP=dist/Polysquish.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/Polysquish" "$APP/Contents/MacOS/Polysquish"
          cp desktop/packaging/Info.plist "$APP/Contents/Info.plist"

          # .icns from the generated 512x512 PNG.
          ICONSET=dist/Polysquish.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" desktop/icons/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
          done
          for s in 16 32 128 256 512; do
            d=$((s * 2))
            sips -z "$d" "$d" desktop/icons/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/Polysquish.icns"
          rm -rf "$ICONSET"

          # Ad-hoc signature so the binary launches on Apple Silicon without being killed.
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
      - name: Create .dmg
        run: |
          set -euo pipefail
          mkdir -p dist/dmg
          cp -R dist/Polysquish.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Polysquish -srcfolder dist/dmg -ov -format UDZO \
            "dist/Polysquish-${{ matrix.arch }}.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Polysquish-macos-${{ matrix.arch }}
          path: dist/Polysquish-${{ matrix.arch }}.dmg
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/Polysquish-${{ matrix.arch }}.dmg

  windows:
    name: Windows x86_64 (zip + msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-windows
      - name: Build
        run: cargo build --release -p polysquish-desktop
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/Polysquish.exe -DestinationPath dist/Polysquish-windows-x86_64.zip -Force
      # The MSI is best effort: it needs cargo-wix (compiled from source here) and the WiX v3
      # toolset present on the runner image. If either is missing the zip is still published.
      - name: Install cargo-wix (best effort)
        id: cargo_wix
        continue-on-error: true
        timeout-minutes: 15
        run: cargo install cargo-wix --locked
      - name: Build MSI (best effort)
        if: steps.cargo_wix.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo wix init -p polysquish-desktop --force --product-name Polysquish --copyright-holder "Polysquish contributors"
          cargo wix -p polysquish-desktop --nocapture --output dist/Polysquish-x86_64.msi
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: Polysquish-windows-x86_64
          path: |
            dist/Polysquish-windows-x86_64.zip
            dist/Polysquish-x86_64.msi
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/Polysquish-windows-x86_64.zip
            dist/Polysquish-x86_64.msi
