name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  release-binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: polysquish-windows-x64
            bin: polysquish.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: polysquish-macos-arm64
            bin: polysquish
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: polysquish-macos-x64
            bin: polysquish
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: polysquish-linux-x64
            bin: polysquish
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a ../../../${{ matrix.artifact }}.zip ${{ matrix.bin }}; else tar czf ../../../${{ matrix.artifact }}.tar.gz ${{ matrix.bin }}; fi
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
